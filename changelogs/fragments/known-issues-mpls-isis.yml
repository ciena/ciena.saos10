---
known_issues:
  - >-
    saos10_mpls - `state: merged` and `state: deleted` raise
    ``IndexError: list index out of range`` on SAOS 10.11.x. Suspected bug in
    the config builder under ``plugins/module_utils/network/saos10/config/mpls``.
    Tracked for a follow-up fix; the module currently cannot apply MPLS
    configuration.
  - >-
    saos10_isis - the argspec exposes ``admin_state`` directly under the
    instance, but ``ciena-isis@2025-07-11`` only defines ``admin-state`` under
    ``instance/interfaces/interface`` (via the ``admin-control`` grouping).
    Passing ``admin_state`` at the instance level therefore returns
    ``unknown object`` from netconf. Use leaves that ARE valid directly under
    the instance (``dynamic_hostname``, ``distance``, ``level_type``, ``net``,
    ``lsp_refresh``, ``lsp_lifetime`` etc.) until the argspec is regenerated
    against the current YANG. Verified by fetching the live ``ciena-isis``
    schema and confirming a ``<dynamic-hostname>true</dynamic-hostname>`` RPC
    succeeds on the same device that rejects ``<admin-state>``.
