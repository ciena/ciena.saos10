---
bugfixes:
  - >-
    saos10_mpls (facts) - guard ``data.xpath("//mpls")[0]`` against an empty
    result. On any device with no MPLS subtree configured the facts gather
    raised ``IndexError: list index out of range`` before the module could
    even compose an edit-config, breaking both ``state: merged`` and
    ``state: deleted``.
  - >-
    saos10_mpls (config) - MPLS is a singleton YANG container, but the
    code-generation template assumed it was a list of keyed items (the file
    shipped with ``XML_ITEMS = "None"`` and ``XML_ITEMS_KEY = "None"`` as
    literal strings, and ``_state_deleted`` did ``config["None"]``). Rewrote
    ``_state_deleted`` so that an empty ``config:`` removes the whole
    ``<mpls>`` subtree (and is a no-op when nothing is configured) and taught
    ``create_xml_config_from_dict`` to honour an ``_operation`` sentinel that
    promotes itself to ``operation="..."`` on the root element.
